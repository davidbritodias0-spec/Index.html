<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformers G1</title>
    <style>
        /* RESET E CONFIGURAÇÕES GERAIS */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        
        body {
            background-color: #000; color: #fff; padding: 20px 10px; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; transition: background-color 0.4s ease; overflow-x: hidden;
            width: 100%;
        }
        
        h1 { width: 100%; text-align: center; color: #ffd700; margin-bottom: 10px; font-size: 24px; }
        
        /* CONTAINER DE ÁUDIO */
        .audio-container { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; }
        audio { background-color: #222; border-radius: 30px; border: 2px solid #ffd700; max-width: 100%; }

        /* TELA 1: SELEÇÃO DE FACÇÃO INICIAL */
        .tela-faccoes {
            display: flex; gap: 20px; justify-content: center; align-items: center;
            width: 100%; max-width: 500px; margin-top: 30px; transition: all 0.5s ease;
        }
        
        .card-faccao {
            width: 165px; height: 250px; border: 3px solid #333; border-radius: 12px;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
            justify-content: center; background: #111; transition: transform 0.3s ease, box-shadow 0.3s ease;
            padding: 15px; text-align: center;
        }
        
        .card-faccao img { width: 100%; height: 150px; object-fit: contain; margin-bottom: 15px; }
        .card-faccao h2 { font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        
        .card-faccao.escolha-autobot:hover { border-color: #e50000; box-shadow: 0 0 20px #e50000; transform: scale(1.05); }
        .card-faccao.escolha-autobot h2 { color: #e50000; }
        
        .card-faccao.escolha-decepticon:hover { border-color: #7b2cbf; box-shadow: 0 0 20px #7b2cbf; transform: scale(1.05); }
        .card-faccao.escolha-decepticon h2 { color: #7b2cbf; }

        /* TELA 2: GRID DE PERSONAGENS */
        .tela-personagens {
            display: none; flex-wrap: wrap; gap: 15px; justify-content: center; 
            width: 100%; max-width: 900px; margin-bottom: 25px;
        }
        
        .escondido { display: none !important; }

        /* BOTÃO VOLTAR */
        .btn-voltar {
            display: none; padding: 10px 20px; font-size: 11px; font-weight: bold;
            color: #fff; background: #111; border: 2px solid #ffd700; border-radius: 6px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 25px; transition: all 0.3s ease;
        }
        .btn-voltar:hover { background: #ffd700; color: #000; box-shadow: 0 0 15px #ffd700; }

        /* CARDS INTERATIVOS 3D */
        .card { width: 165px; height: 250px; position: relative; perspective: 1000px; cursor: pointer; }
        .card-inner { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .lado { position: absolute; width: 100%; height: 100%; border-radius: 12px; backface-visibility: hidden; overflow: hidden; border: 3px solid; display: flex; flex-direction: column; }
        .lado img { width: 100%; height: 175px; object-fit: contain; background: #fff; padding: 8px; }
        .lado h3 { text-align: center; padding: 8px 4px; font-size: 13px; background: #111; }
        
        .autobot .lado { border-color: #e50000; background: #111; }
        .autobot h3 { color: #e50000; }
        .autobot.brilhar .lado { box-shadow: 0 0 20px #e50000, inset 0 0 10px #e50000; }
        
        .decepticon .lado { border-color: #7b2cbf; background: #111; }
        .decepticon h3 { color: #7b2cbf; }
        .decepticon.brilhar .lado { box-shadow: 0 0 20px #7b2cbf, inset 0 0 10px #7b2cbf; }
        
        .logo { transform: rotateY(0deg) translateZ(48px); z-index: 3; }
        .logo img { background: #222; }
        .lider { transform: rotateY(120deg) translateZ(48px); z-index: 2; }
        .dados { transform: rotateY(240deg) translateZ(48px); z-index: 1; background: #111 !important; padding: 12px 8px; justify-content: center; }
        
        .dados p { margin: 5px 0; font-size: 11px; line-height: 1.3; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .dados strong { color: #ffd700; display: block; font-size: 10px; text-transform: uppercase; }
        
        .estagio-1 { transform: rotateY(0deg); }
        .estagio-2 { transform: rotateY(-120deg); }
        .estagio-3 { transform: rotateY(-240deg); }
        
        /* HUD CONTAINER */
        .hud-container {
            width: 100%; max-width: 360px; background: rgba(15, 15, 15, 0.95); border: 2px solid #222;
            border-radius: 12px; padding: 15px; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 12px; margin-top: 20px;
            opacity: 0; visibility: hidden; transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
        }
        .hud-container.visivel { opacity: 1; visibility: visible; transform: translateY(0); }
        .hud-titulo { font-size: 11px; color: #ffd700; text-align: center; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px dashed #333; padding-bottom: 6px; }
        .hud-subtitulo { text-align: center; font-size: 13px; font-weight: bold; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        
        .barra-status { display: flex; flex-direction: column; gap: 4px; }
        .label-container { display: flex; justify-content: space-between; font-size: 11px; color: #ccc; }
        .grid-energia { width: 100%; height: 12px; background: #111; border: 1px solid #333; border-radius: 3px; overflow: hidden; }
        .preenchimento-energia { height: 100%; width: 0%; transition: width 0.6s ease, background-color 0.4s; box-shadow: 0 0 8px currentColor; }
    </style>
</head>
<body>
