<!-- PARTE 1: ESTRUTURA INICIAL E CSS ATUALIZADO -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformers G1 - Seleção de Facção</title>
    <style>
        /* RESET E CONFIGURAÇÕES GERAIS */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        
        body {
            background-color: #000; color: #fff; padding: 20px 10px; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; transition: background-color 0.4s ease; overflow-x: hidden;
            width: 100%;
        }
        
        h1 { width: 100%; text-align: center; color: #ffd700; margin-bottom: 10px; font-size: 24px; }
        
        /* CONTAINER DE ÁUDIO */
        .audio-container { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; }
        audio { background-color: #222; border-radius: 30px; border: 2px solid #ffd700; max-width: 100%; }

        /* ==========================================================================
           TELA 1: SELEÇÃO DE FACÇÃO (INICIAL)
           ========================================================================== */
        .tela-faccoes {
            display: flex; gap: 30px; justify-content: center; align-items: center;
            width: 100%; max-width: 600px; margin-top: 40px; transition: all 0.5s ease;
        }
        
        /* Card grande para escolher o lado */
        .card-faccao {
            width: 220px; height: 300px; border: 4px solid #333; border-radius: 15px;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
            justify-content: center; background: #111; transition: transform 0.3s ease, box-shadow 0.3s ease;
            padding: 20px; text-align: center;
        }
        
        .card-faccao img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 15px; }
        .card-faccao h2 { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Efeitos de Hover para a escolha inicial */
        .card-faccao.escolha-autobot:hover { border-color: #e50000; box-shadow: 0 0 25px #e50000; transform: scale(1.05); }
        .card-faccao.escolha-autobot h2 { color: #e50000; }
        
        .card-faccao.escolha-decepticon:hover { border-color: #7b2cbf; box-shadow: 0 0 25px #7b2cbf; transform: scale(1.05); }
        .card-faccao.escolha-decepticon h2 { color: #7b2cbf; }

        /* ==========================================================================
           TELA 2: GRID DE PERSONAGENS (ESCONDIDO POR PADRÃO)
           ========================================================================== */
        .tela-personagens {
            display: none; /* Ativado via JS adicionando display: flex */
            flex-wrap: wrap; gap: 15px; justify-content: center; 
            width: 100%; max-width: 1000px; margin-bottom: 25px; animation: fadeIn 0.6s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Classes utilitárias para esconder elementos visualmente */
        .escondido { display: none !important; }

        /* ==========================================================================
           BOTÃO VOLTAR RETRÔ
           ========================================================================== */
        .btn-voltar {
            display: none; padding: 10px 24px; font-size: 12px; font-weight: bold;
            color: #fff; background: #111; border: 2px solid #ffd700; border-radius: 6px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 25px; transition: all 0.3s ease; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }
        .btn-voltar:hover { background: #ffd700; color: #000; box-shadow: 0 0 15px #ffd700; transform: translateY(-2px); }

        /* ==========================================================================
           ESTILOS DOS CARDS INTERATIVOS 3D (MECÂNICA ORIGINAL)
           ========================================================================== */
        .card { width: 165px; height: 250px; position: relative; perspective: 1000px; cursor: pointer; }
        .card-inner { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .lado { position: absolute; width: 100%; height: 100%; border-radius: 12px; backface-visibility: hidden; overflow: hidden; border: 3px solid; display: flex; flex-direction: column; transition: box-shadow 0.3s ease, filter 0.3s ease; }
        .lado img { width: 100%; height: 180px; object-fit: contain; background: #fff; padding: 8px; }
        .lado h3 { text-align: center; padding: 8px 4px; font-size: 13px; background: #111; }
        
        /* Customização dos Autobots */
        .autobot .lado { border-color: #e50000; background: #111; }
        .autobot h3 { color: #e50000; }
        .autobot.brilhar .lado { box-shadow: 0 0 20px #e50000, inset 0 0 10px #e50000; filter: drop-shadow(0 0 5px #e50000); }
        
        /* Customização dos Decepticons */
        .decepticon .lado { border-color: #7b2cbf; background: #111; }
        .decepticon h3 { color: #7b2cbf; }
        .decepticon.brilhar .lado { box-shadow: 0 0 20px #7b2cbf, inset 0 0 10px #7b2cbf; filter: drop-shadow(0 0 5px #7b2cbf); }
        
        /* Configuração das Faces do Cubo/Card Rotativo */
        .logo { transform: rotateY(0deg) translateZ(48px); z-index: 3; }
        .logo img { background: #222; }
        .lider { transform: rotateY(120deg) translateZ(48px); z-index: 2; }
        .dados { transform: rotateY(240deg) translateZ(48px); z-index: 1; background: #111 !important; padding: 12px 8px; justify-content: center; }
        
        .dados p { margin: 5px 0; font-size: 11px; line-height: 1.3; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .dados strong { color: #ffd700; display: block; font-size: 10px; text-transform: uppercase; }
        
        /* Estágios de Rotação controlados via JS */
        .estagio-1 { transform: rotateY(0deg); }
        .estagio-2 { transform: rotateY(-120deg); }
        .estagio-3 { transform: rotateY(-240deg); }
        
        /* ==========================================================================
           PAINEL DE DIAGNÓSTICO HUD
           ========================================================================== */
        .hud-container {
            width: 100%; max-width: 360px; background: rgba(15, 15, 15, 0.95); border: 2px solid #222;
            border-radius: 12px; padding: 15px; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 12px; margin-top: 20px;
            opacity: 0; visibility: hidden; transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
        }
        .hud-container.visivel { opacity: 1; visibility: visible; transform: translateY(0); }
        .hud-titulo { font-size: 11px; color: #ffd700; text-align: center; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px dashed #333; padding-bottom: 6px; }
        .hud-subtitulo { text-align: center; font-size: 13px; font-weight: bold; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        
        .barra-status { display: flex; flex-direction: column; gap: 4px; }
        .label-container { display: flex; justify-content: space-between; font-size: 11px; color: #ccc; }
        .grid-energia { width: 100%; height: 12px; background: #111; border: 1px solid #333; border-radius: 3px; overflow: hidden; }
        .preenchimento-energia { height: 100%; width: 0%; transition: width 0.6s ease, background-color 0.4s; box-shadow: 0 0 8px currentColor; }
    </style>
</head>
<body>
    
<!-- PARTE 2 - SEÇÃO A: TÍTULO, CONTROLES DE ÁUDIO E SONS AUTOBOTS -->
    <h1>TRANSFORMERS G1</h1>
    
    <!-- CONTROLE DE TRILHA SONORA LOCAL -->
    <div class="audio-container">
        <audio id="bg-music" src="tema.mp3" controls loop></audio>
    </div>
    
    <!-- EFEITO SONORO GLOBAL DE TRANSFORMAÇÃO -->
    <audio id="transform-sound" src="transformacao.mp3" preload="auto"></audio>

    <!-- Optimus Prime -->
    <audio id="optimus-frase-0" src="optimus1.mp3" preload="auto"></audio>
    <audio id="optimus-frase-1" src="optimus2.mp3" preload="auto"></audio>
    <audio id="optimus-frase-2" src="optimus3.mp3" preload="auto"></audio>

    <audio id="jazz-frase-0" src="jazz0.mp3" preload="auto"></audio>

    <audio id="jazz-frase-2" src="jazz2.mp3" preload="auto"></audio>

    <!-- Cliffjumper -->
    <audio id="cliffjumper-frase-0" src="cliffjumper0.mp3" preload="auto"></audio>
    <audio id="cliffjumper-frase-1" src="cliffjumper1.mp3" preload="auto"></audio>
    <audio id="cliffjumper-frase-2" src="cliffjumper2.mp3" preload="auto"></audio>

    <!-- Wheeljack -->
    <audio id="wheeljack-frase-0" src="wheeljack0.mp3" preload="auto"></audio>
    <audio id="wheeljack-frase-1" src="wheeljack1.mp3" preload="auto"></audio>

    <!-- Grimlock -->
    <audio id="grimlock-frase-0" src="grimlock0.mp3" preload="auto"></audio>
